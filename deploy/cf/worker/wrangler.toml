name = "evo-espana-rag"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Cosine, because the stored vectors are L2-normalised (embed.py normalises).
[[vectorize]]
binding = "VECTORIZE"
index_name = "evo-corpus"

[[d1_databases]]
binding = "DB"
database_name = "evo-corpus"
database_id = "REPLACE_AFTER_CREATE"

# Secrets are set with `wrangler secret put`, never committed:
#   HF_TOKEN        Hugging Face token (embeds queries with multilingual-e5-large)
#   GEMINI_API_KEY  generation
#   RAG_TOKEN       the shared secret callers must send as `Authorization: Bearer …`
